services:
  postgres:
    build:
      context: ./docker/postgres
    container_name: asistencia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tesis_backup.dump:/backup/tesis_backup.dump:ro
    networks:
      - asistencia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asistencia-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env.docker
    environment:
      SUPABASE_DB_URL: postgresql://postgres:postgrespassword@postgres:5432/postgres
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asistencia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: asistencia-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - asistencia-net

volumes:
  postgres_data:
  uploads_data:

networks:
  asistencia-net:
    driver: bridge